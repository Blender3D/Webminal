<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webminal — Verification</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff; --bg2: #f9f9f8; --bg3: #f3f3f1;
    --text: #111111; --muted: #6b7280; --border: rgba(0,0,0,0.1);
    --green-bg: #eaf3de; --green-txt: #3b6d11;
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Mono', monospace;
    --radius-md: 8px; --radius-lg: 12px;
  }

  html, body { height: 100%; font-family: var(--font-sans); background: var(--bg2); color: var(--text); -webkit-font-smoothing: antialiased; }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px; border-bottom: 0.5px solid var(--border);
    background: var(--bg); position: sticky; top: 0; z-index: 10;
  }
  .logo { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--text); text-decoration: none; }
  .nav-links { display: flex; align-items: center; gap: 4px; }
  .nav-links a { font-size: 13px; color: var(--muted); text-decoration: none; padding: 5px 10px; border-radius: var(--radius-md); transition: background 0.15s, color 0.15s; }
  .nav-links a:hover { background: var(--bg3); color: var(--text); }

  .page { max-width: 480px; margin: 0 auto; padding: 80px 24px 64px; text-align: center; }

  .card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 32px 24px;
  }
  .card h2 {
    font-family: var(--font-mono); font-size: 18px; font-weight: 600;
    margin-bottom: 16px; line-height: 1.4;
  }
  .card a {
    display: inline-block; margin-top: 8px;
    font-size: 14px; color: var(--green-txt); text-decoration: underline;
  }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    nav { padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
    .nav-links { gap: 2px; flex-wrap: wrap; }
    .nav-links a { font-size: 12px; padding: 4px 8px; }
    .nav-hide { display: none; }
    .page { padding: 36px 16px 48px; }
    .page-title { font-size: 18px; }
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>

<nav>
  <a href="{{ url_for('index') }}" class="logo">[webminal]</a>
  <div class="nav-links">
    <a href="{{ url_for('faq') }}">FAQ</a>
    <a href="{{ url_for('register') }}">Register</a>
    <a href="{{ url_for('login') }}">Log in</a>
  </div>
</nav>

<!-- LIVE TICKER -->
<section style="border-bottom: 0.5px solid rgba(0,0,0,0.1); overflow: hidden; height: 32px; background: #0d0f14; display: flex; align-items: center; padding: 0;">
  <a href="/live/" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #00cc6a; padding: 0 16px; white-space: nowrap; display: flex; align-items: center; gap: 6px; text-decoration: none; border-right: 1px solid rgba(255,255,255,0.06); height: 100%;"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#00cc6a;animation:pulse 2s infinite;"></span>live</a>
  <div style="flex:1; overflow: hidden; position: relative; height: 100%;">
    <div id="live-ticker" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6b7280; white-space: nowrap; position: absolute; display: flex; gap: 32px; align-items: center; height: 100%; will-change: transform;"></div>
  </div>
</section>

<div class="page">
  <div class="card">
    <h2>{{ message }}</h2>
    <a href="{{ url_for('index') }}">Back to Webminal</a>
  </div>
</div>

<script>
(function() {
  var ticker = document.getElementById('live-ticker');
  if (!ticker) return;
  function buildTicker(cmds) { ticker.innerHTML = ''; var allCmds = cmds.concat(cmds); for (var i = 0; i < allCmds.length; i++) { var span = document.createElement('span'); span.textContent = allCmds[i]; span.style.color = '#c8d3f5'; ticker.appendChild(span); var dot = document.createElement('span'); dot.textContent = '\u00b7'; dot.style.color = '#6b7280'; dot.style.margin = '0 8px'; ticker.appendChild(dot); } }
  function startScroll() { var pos = 0, halfWidth = ticker.scrollWidth / 2; if (halfWidth === 0) return; function step() { pos -= 0.5; if (Math.abs(pos) >= halfWidth) pos = 0; ticker.style.transform = 'translateX(' + pos + 'px)'; requestAnimationFrame(step); } step(); }
  function fetchAndScroll() { var xhr = new XMLHttpRequest(); xhr.open('GET', '/api/live/?t=' + Date.now()); xhr.onload = function() { if (xhr.status === 200 && xhr.responseText.trim()) { var cmds = xhr.responseText.trim().split('\n'); if (cmds.length > 0) { buildTicker(cmds); startScroll(); } } }; xhr.send(); }
  fetchAndScroll(); setInterval(fetchAndScroll, 15000);
})();
</script>

</body>
</html>
